plugins {
    id 'java'
}

group 'org.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.testng:testng:7.6.1'
    implementation 'org.seleniumhq.selenium:selenium-java:4.5.0'
    testImplementation 'io.github.bonigarcia:webdrivermanager:5.8.0'
}

// Get project properties with defaults
def browser = project.hasProperty('browser') ? project.property('browser') : 'chrome'
def suite = project.hasProperty('suite') ? project.property('suite') : 'regression'

test {
    useTestNG() {
        outputDirectory = file("$buildDir/test-results/test")
        useDefaultListeners = true
        
        // Define which tests to run based on suite parameter
        def suiteFile = file("src/test/resources/${suite}.xml")
        suiteXmlFiles = [suiteFile]
        
        // Set parallel execution
        parallel = 'methods'
        threadCount = suite == 'smoke' ? 2 : 4
    }

    // Pass browser parameter to tests as a system property
    systemProperty 'browser', browser

    // Configure test logging
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }

    // Configure reports
    reports {
        junitXml {
            required = true
            outputLocation = file("$buildDir/test-results/test")
        }
        html {
            required = true
            outputLocation = file("$buildDir/reports/tests")
        }
    }
}